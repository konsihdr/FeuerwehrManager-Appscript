# Beide Suiten bei jedem Push auf main und jedem Pull Request – dieselben, die vor jedem
# Commit laufen (CLAUDE.md, Abschnitt 8). Weiterhin ohne Pakete: Node kommt von
# setup-node, Chrome bringt der Runner mit, zbar kommt aus apt.
name: Prüfen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Der Lauf liest nur; kein Token, das schreiben könnte.
permissions:
  contents: read

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Aktionen auf den Commit festgelegt, nicht auf das verschiebbare Tag dahinter.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # die kleinste, die package.json zusagt
          package-manager-cache: false

      - name: zbar
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends zbar-tools

      # Fehlt zbarimg, überspringt die Oberfläche die Codes still – hier soll es scheitern.
      - name: Werkzeuge
        id: werkzeuge
        run: |
          node --version
          google-chrome --version
          zbarimg --version

      - name: Server
        run: node test/server.mjs

      # Auch wenn der Server scheitert: beide Ergebnisse sehen, nicht nur das erste.
      - name: Oberfläche
        if: ${{ !cancelled() && steps.werkzeuge.outcome == 'success' }}
        env:
          CHROMIUM: /usr/bin/google-chrome
          FOTOS: ${{ runner.temp }}/fotos
        run: |
          mkdir -p "$FOTOS"
          node test/oberflaeche.mjs

      - name: Bildschirmfotos
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bildschirmfotos
          path: ${{ runner.temp }}/fotos
          retention-days: 7
          if-no-files-found: ignore
