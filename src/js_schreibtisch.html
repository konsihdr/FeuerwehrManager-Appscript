<script>
/**
 * Der Schreibtisch: Seitenleiste, Kopfzeile und die Seiten der Verwaltung.
 *
 * Die Seitenleiste zeigt jeder Rolle ihren Ausschnitt. Verlassen darf man sich darauf
 * nicht – der Schutz sitzt in `10_Tuer.js` auf dem Server. Hier geht es darum,
 * niemandem eine Tür zu zeigen, die für ihn verschlossen ist.
 */
'use strict';

const NAV = [
  {
    titel: 'Betrieb',
    eintraege: [
      { seite: '', symbol: 'aktionsliste', titel: 'Aktionsliste', zahl: true },
      { seite: 'geraete', symbol: 'geraet', titel: 'Geräte' },
      { seite: 'saetze', symbol: 'satz', titel: 'Gerätesätze' },
    ],
  },
  {
    titel: 'Stammdaten',
    eintraege: [
      { seite: 'typen', symbol: 'typ', titel: 'Gerätetypen & Prüfpläne', rollen: TECHNIK },
      { seite: 'lagerplaetze', symbol: 'lager', titel: 'Lagerplätze', rollen: TECHNIK },
      { seite: 'gruende', symbol: 'umlagern', titel: 'Umlagerungsgründe', rollen: TECHNIK },
      { seite: 'etiketten', symbol: 'etikett', titel: 'Etiketten' },
    ],
  },
  {
    titel: 'Personal',
    eintraege: [
      { seite: 'personal', symbol: 'atemschutz', titel: 'Atemschutz & Nachweise', rollen: PERSONAL, modul: 'personal', zahl: 'personal' },
      { seite: 'einsaetze', symbol: 'einsatz', titel: 'Einsätze & Stunden', rollen: PERSONAL, modul: 'personal' },
      { seite: 'qualifikationen', symbol: 'qualifikation', titel: 'Qualifikationsarten', rollen: PERSONAL, modul: 'personal' },
    ],
  },
  {
    titel: 'Verwaltung',
    eintraege: [
      { seite: 'mitglieder', symbol: 'mitglieder', titel: 'Mitglieder' },
      { seite: 'protokoll', symbol: 'protokoll', titel: 'Protokoll', rollen: VERWALTUNG },
      { seite: 'import', symbol: 'importexport', titel: 'Import & Export', rollen: TECHNIK },
      { seite: 'regeln', symbol: 'regeln', titel: 'Regeln', rollen: TECHNIK },
      { seite: 'einstellungen', symbol: 'einstellungen', titel: 'Einstellungen' },
    ],
  },
];

const SEITEN = {
  '': () => seiteAktionsliste(),
  geraete: (p) => seiteGeraete(p),
  saetze: (p) => seiteSaetze(p),
  typen: (p) => seiteTypen(p),
  lagerplaetze: () => seiteLagerplaetze(),
  gruende: () => seiteGruende(),
  etiketten: () => seiteEtiketten(),
  mitglieder: () => seiteMitglieder(),
  personal: (p) => seitePersonal(p),
  einsaetze: (p) => seiteEinsaetze(p),
  qualifikationen: () => seiteQualifikationen(),
  protokoll: () => seiteProtokoll(),
  import: () => seiteImport(),
  regeln: () => seiteRegeln(),
  einstellungen: () => seiteEinstellungen(),
};

const UEBERLAGERT = '(max-width: 1100px)';

function leisteOffen() {
  if (Z.leiste === undefined) Z.leiste = window.matchMedia(UEBERLAGERT).matches ? false : Ablage.lesen('leiste', true);
  return Z.leiste;
}

function schreibtischZeichnen(app) {
  const teile = Router.teile();
  // Dialoge, die an der Adresse hängen, gehen mit ihr – auch beim Zurück-Knopf.
  if (offeneAkte && !offeneAkte.zu && offeneAkte.ausAdresse && !(teile[0] === 'geraete' && teile[1] === offeneAkte.geraetId)) offeneAkte.schliessen();
  if (offenerSatz && !offenerSatz.zu && !(teile[0] === 'saetze' && teile[1] === offenerSatz.satzId)) offenerSatz.schliessen();
  if (offenePersonalakte && !offenePersonalakte.zu && offenePersonalakte.ausAdresse && !(teile[0] === 'personal' && teile[1] === offenePersonalakte.mitgliedId)) offenePersonalakte.schliessen();
  if (offenerEinsatz && !offenerEinsatz.zu && offenerEinsatz.ausAdresse && !(teile[0] === 'einsaetze' && teile[1] === offenerEinsatz.einsatzId)) offenerEinsatz.schliessen();
  const seite = SEITEN[teile[0] || ''] ? teile[0] || '' : '';
  const eintrag = NAV.flatMap((g) => g.eintraege).find((e) => e.seite === seite);
  if (eintrag && !navSichtbar(eintrag)) {
    gehe('/', true);
    return;
  }
  const ueberlagert = window.matchMedia(UEBERLAGERT).matches;
  const offen = leisteOffen();
  const k = Z.daten.kennzahlen;
  const p = Z.daten.personal;
  const zahlen = { true: k.ueberfaellig + k.bald, personal: p ? p.abgelaufen + p.bald : 0 };
  const ich = Z.daten.ich;
  const thema = Ablage.lesen('thema', 'system');

  const umschalten = () => {
    Z.leiste = !offen;
    if (!ueberlagert) Ablage.schreiben('leiste', Z.leiste);
    zeichnen();
  };

  const leiste = h('aside.seitenleiste',
    h('div.marke', wehrLogo('marke-logo', 22),
      h('span.marke-text', h('span.marke-titel', Z.daten.wehr.name || 'FeuerwehrManager'), h('span.marke-untertitel', Z.daten.wehr.zusatz || 'Lager & Prüfwesen'))),
    h('nav.nav', NAV.map((g) => {
      const sichtbar = g.eintraege.filter(navSichtbar);
      if (!sichtbar.length) return null;
      return [h('div.nav-gruppe', g.titel), sichtbar.map((e) => h('a' + (e.seite === seite ? '.aktiv' : ''), {
        href: '#/' + e.seite,
        onclick: (ev) => {
          ev.preventDefault();
          if (ueberlagert) Z.leiste = false;
          gehe('/' + e.seite);
        },
      }, h('span.nav-symbol', icon(e.symbol, 19)), h('span', e.titel), e.zahl && zahlen[e.zahl] ? h('span.nav-zahl', zahlen[e.zahl]) : null))];
    })),
    h('div.seitenleiste-fuss', 'FeuerwehrManager ' + Z.daten.version + ' · Apps Script'));

  const kopf = h('header.kopfzeile',
    h('button.btn.btn-klein', { onclick: umschalten, 'aria-label': offen ? 'Menü zuklappen' : 'Menü aufklappen', title: 'Menü' }, icon(ueberlagert && offen ? 'x' : 'menue', 17)),
    h('span.kopf-marke', Z.daten.wehr.name || 'FeuerwehrManager'),
    h('span.kopf-raum'),
    syncAnzeige(),
    // Kein „Abmelden“: Angemeldet ist das Firmenkonto bei Google, nicht diese Anwendung.
    h('div.benutzer-chip', { title: ich.name + ' · ' + ROLLE_TEXT[ich.rolle] + ' · ' + ich.email },
      h('span.benutzer-avatar', initialen(ich.name)),
      h('span.benutzer-text', h('div.benutzer-name', ich.name), h('div.benutzer-rolle', ROLLE_TEXT[ich.rolle]))),
    h('button.btn.btn-klein', {
      onclick: () => {
        Ablage.schreiben('halle', true);
        gehe('/halle');
      },
      title: 'Ansicht für die Fahrzeughalle: große Knöpfe, Kamera als Scanner',
    }, icon('halle', 15), h('span.kopf-text-knopf', 'Halle')),
    h('button.btn.btn-klein', { onclick: themaWechseln, title: 'Thema: ' + { system: 'wie das System', light: 'hell', dark: 'dunkel' }[thema], 'aria-label': 'Thema wechseln' },
      icon({ system: 'automatisch', light: 'sonne', dark: 'mond' }[thema], 15)));

  const inhalt = h('main.inhalt');
  const y = window.scrollY;
  const gleicheSeite = app.dataset.seite === seite && app.dataset.ansicht === 'schreibtisch';
  inhalt.append(...flach(SEITEN[seite](teile[1] || null)));
  mitFokus(() => {
    app.replaceChildren(h('div.admin' + (offen ? '.leiste-offen' : '.leiste-zu') + (ueberlagert ? '.leiste-ueberlagert' : ''),
      ueberlagert && offen ? h('div.leisten-schatten', { onclick: umschalten }) : null,
      leiste,
      h('div.hauptbereich', kopf, inhalt)));
  });
  app.dataset.ansicht = 'schreibtisch';
  app.dataset.seite = seite;
  if (gleicheSeite) window.scrollTo(0, y);
}

/** Zeigt die Seitenleiste diesen Eintrag – nach Rolle und eingeschaltetem Modul? */
function navSichtbar(e) {
  if (e.rollen && !darf.apply(null, e.rollen)) return false;
  return !e.modul || !!(Z.daten.module && Z.daten.module[e.modul] && (e.modul !== 'personal' || Z.daten.nachweise));
}

/**
 * Eine Hallensitzung beenden (Ausweis/Kürzel). Am Schreibtisch gibt es nichts abzumelden.
 *
 * Erst wird gespeichert, was noch unterwegs ist – unter dem Namen dessen, der es
 * gebucht hat. Geht das gerade nicht (keine Verbindung), bleibt seine Sitzung auf dem
 * Server offen, bis sie von selbst abläuft: Die Änderungen tragen ihr Token und gehen
 * hinaus, sobald es wieder Verbindung gibt – auch wenn bis dahin schon der Nächste
 * angemeldet ist.
 */
async function abmelden() {
  const token = Z.token;
  await Sync.abwarten();
  const offen = Sync.schlange.filter((o) => o.token === token).length;
  if (!offen) {
    try {
      await api('sitzung.abmelden', {}, { sofort: true });
    } catch (e) {
      // Abgemeldet ist man so oder so.
    }
  }
  sitzungVerloren(offen ? plural(offen, 'Änderung wird', 'Änderungen werden') + ' nachgereicht, sobald wieder Verbindung besteht.' : '');
}

function werkzeugleiste(titel, untertitel, knoepfe) {
  return h('div.werkzeugleiste',
    h('div', h('h1', titel), untertitel ? h('div.untertitel', untertitel) : null),
    h('div.knopfreihe', flach(knoepfe)));
}

function knopf(text, symbol, klick, klasse) {
  return h('button.btn' + (klasse ? '.' + klasse : ''), { onclick: klick }, symbol ? icon(symbol, 16) : null, text);
}

// ─────────────────────────────── Aktionsliste ───────────────────────────────

const AUFGABE = {
  pruefung: { titel: 'Prüfung', knopf: 'Prüfung erfassen' },
  reinigung: { titel: 'Reinigen', erklaerung: 'nach Einsatz – wieder einsatzbereit machen', knopf: 'Gereinigt' },
  reparatur: { titel: 'Reparatur', erklaerung: 'als defekt gemeldet', knopf: 'Instandgesetzt' },
};

function zustandErledigen(a) {
  const g = Z.idx.geraet.get(a.geraet_id);
  return a.art === 'reinigung'
    ? sofort('betrieb.gereinigt', { geraet: g.id }, geraetTitel(g) + ' ist wieder einsatzbereit.')
    : sofort('betrieb.statusSetzen', { geraete: [g.id], status: 'einsatzbereit' }, geraetTitel(g) + ' ist wieder einsatzbereit.');
}

function seiteAktionsliste() {
  const z = ui('aktionsliste', { tage: null, sortiert: 'faellig' });
  const k = Z.daten.kennzahlen;
  const zeitraum = z.tage === null ? k.vorwarnung : z.tage;
  const liste = Z.daten.arbeitsliste.filter((a) => a.art !== 'pruefung' || a.tage <= zeitraum);
  const ueberfaellig = liste.filter((a) => a.ueberfaellig).length;
  const ohneTermin = liste.filter((a) => a.art !== 'pruefung').length;
  const technik = istTechnik();
  const personal = istPersonal() ? Z.daten.personal : null;
  const zuGeraeten = (status) => () => {
    Object.assign(ui('geraete', {}), { status: status, ausgemustert: false });
    gehe('/geraete');
  };

  const kachel = (wert, titel, art, klick) => h(klick ? 'button.kachel' : 'div.kachel', { class: art || '', onclick: klick || null },
    h('div.kachel-wert', String(wert)), h('div.kachel-titel', titel));

  return [
    werkzeugleiste('Aktionsliste', null, [
      h('select', {
        id: 'zeitraum',
        style: { width: 'auto' },
        onchange: (e) => {
          z.tage = Number(e.target.value);
          zeichnen();
        },
      }, [[0, 'Nur überfällige'], [7, 'Fällig in 7 Tagen'], [k.vorwarnung, 'Fällig in ' + k.vorwarnung + ' Tagen (Vorgabe)'], [90, 'Fällig in 90 Tagen'], [365, 'Fällig in einem Jahr']]
        .filter((o, i, alle) => alle.findIndex((x) => x[0] === o[0]) === i)
        .map((o) => h('option', { value: o[0], selected: o[0] === zeitraum }, o[1]))),
    ]),
    h('div.kacheln',
      kachel(k.ueberfaellig, 'Überfällige Prüfungen', k.ueberfaellig ? 'warnung' : 'gut'),
      kachel(k.bald, 'Fällig in ' + k.vorwarnung + ' Tagen', k.bald ? 'hinweis' : ''),
      kachel(k.geraete, 'Geräte im Dienst', '', () => gehe('/geraete')),
      kachel(k.zu_reinigen, 'Zu reinigen', k.zu_reinigen ? 'hinweis' : '', zuGeraeten('zu_reinigen')),
      kachel(k.zur_pruefung, 'In der Werkstatt', '', zuGeraeten('zur_pruefung')),
      kachel(k.defekt, 'Defekt', k.defekt ? 'warnung' : '', zuGeraeten('defekt')),
      kachel(k.saetzeUnvollstaendig, 'Unvollständige Sätze' + (k.saetzeAbweichend ? ' · ' + k.saetzeAbweichend + ' abweichend' : ''),
        k.saetzeUnvollstaendig ? 'warnung' : '', () => gehe('/saetze')),
      personal ? kachel(personal.tauglich + ' / ' + personal.traeger, 'Atemschutztauglich', personal.tauglich < personal.traeger ? 'hinweis' : 'gut', () => gehe('/personal')) : null,
      personal ? kachel(personal.abgelaufen, 'Nachweise abgelaufen', personal.abgelaufen ? 'warnung' : 'gut', () => gehe('/personal')) : null),
    k.ohnePlan ? h('div.hinweisbox',
      h('span', h('strong', String(k.ohnePlan)), ' ', k.ohnePlan === 1 ? 'Gerät hat keinen aktiven Prüfplan' : 'Geräte haben keinen aktiven Prüfplan',
        ' – sie stehen in keiner Fälligkeitsliste und werden nie erinnert.'),
      istTechnik() ? h('button.btn.btn-klein', { onclick: () => gehe('/typen') }, 'Gerätetypen öffnen') : null) : null,
    k.saetzeUnvollstaendig || k.saetzeAbweichend ? h('div.fehlerbox',
      h('span', k.saetzeUnvollstaendig ? plural(k.saetzeUnvollstaendig, 'Gerätesatz ist', 'Gerätesätze sind') + ' nicht vollständig – es fehlen Teile. ' : '',
        k.saetzeAbweichend ? plural(k.saetzeAbweichend, 'Satz weicht', 'Sätze weichen') + ' von der Vorlage ab.' : ''),
      h('button.btn.btn-klein', { onclick: () => gehe('/saetze') }, 'Gerätesätze ansehen')) : null,
    h('div.karte',
      h('div.karte-kopf',
        h('h2', 'Anstehende Arbeiten ', h('span.klein.gedimmt', { style: { fontWeight: 400 } },
          '(' + plural(liste.length, 'Vorgang', 'Vorgänge') + (ueberfaellig ? ', davon ' + ueberfaellig + ' überfällig' : '') + (ohneTermin ? ' · ' + ohneTermin + ' ohne Termin' : '') + ')')),
        h('div.knopfreihe',
          technik && liste.length ? h('button.btn.btn-klein', {
            title: 'Zum Mitnehmen in die Werkstatt – mit Kästchen zum Abhaken',
            onclick: (e) => {
              e.currentTarget.disabled = true;
              pdfHolen('arbeitsliste.pdf', { tage: zeitraum }).catch(meldung.fehler.bind(meldung));
            },
          }, icon('drucken', 14), 'Arbeitsliste als PDF') : null,
          h('button.btn.btn-klein', { onclick: () => nachfragen(true), title: 'Änderungen anderer kommen von selbst alle 15 Sekunden' }, 'Aktualisieren'))),
      tabelle({
        zustand: z,
        schluessel: (a) => a.id,
        zeilen: liste,
        leer: 'Nichts zu tun: keine fälligen Prüfungen, nichts zu reinigen, nichts defekt.',
        klick: (a) => akteDialog(a.geraet_id),
        spalten: [
          { id: 'faellig', titel: 'Fälligkeit', wert: (a) => (a.art === 'pruefung' ? a.tage : -99999), zelle: (a) => (a.art === 'pruefung'
            ? [faelligBadge(a.tage), h('div.klein.gedimmt', datum(a.faellig)), a.werkstatt && !a.ueberfaellig ? h('div.klein', { style: { color: 'var(--gelb-600)' } }, 'wartet in der Werkstatt') : null]
            : [h('span.badge.' + (a.art === 'reparatur' ? 'badge-rot' : 'badge-blau'), 'sofort'), h('div.klein.gedimmt', 'kein Termin – Zustand')]) },
          { id: 'aufgabe', titel: 'Aufgabe', wert: (a) => (a.art === 'pruefung' ? (Z.idx.plan.get(a.plan_id) || {}).name : AUFGABE[a.art].titel), zelle: (a) => {
            const p = a.art === 'pruefung' ? Z.idx.plan.get(a.plan_id) : null;
            return [h('strong', p ? p.name : AUFGABE[a.art].titel), h('div.klein.gedimmt', p ? intervallText(a.intervall_wert, a.intervall_einheit) : AUFGABE[a.art].erklaerung)];
          } },
          { id: 'geraet', titel: 'Gerät', wert: (a) => geraetTitel(Z.idx.geraet.get(a.geraet_id)), zelle: (a) => {
            const g = Z.idx.geraet.get(a.geraet_id);
            return [h('strong', geraetTitel(g)), h('div.klein.gedimmt', (g.bezeichnung ? typName(g.geraetetyp_id) + ' · ' : ''), h('span.mono', g.barcode))];
          } },
          { id: 'ort', titel: 'Standort', wert: (a) => ortName(Z.idx.geraet.get(a.geraet_id).lagerplatz_id), zelle: (a) => ortZeile(Z.idx.geraet.get(a.geraet_id).lagerplatz_id) },
          { id: 'status', titel: 'Status', wert: (a) => Z.idx.geraet.get(a.geraet_id).status, zelle: (a) => statusBadge(Z.idx.geraet.get(a.geraet_id).status) },
          { id: 'zuletzt', titel: 'Zuletzt', wert: (a) => a.zuletzt, zelle: (a) => h('span.klein', datum(a.zuletzt)) },
        ],
        aktion: (a) => {
          if (a.art === 'pruefung') return technik ? h('button.btn.btn-klein.btn-primary', { onclick: () => pruefungDialog(a.geraet_id, a.plan_id) }, 'Prüfung erfassen') : null;
          if (a.art === 'reparatur' && !technik) return null;
          return h('button.btn.btn-klein.btn-primary', { onclick: () => zustandErledigen(a) }, AUFGABE[a.art].knopf);
        },
      })),
    personal ? nachweiseKarte(personal) : null,
  ];
}

// ─────────────────────────────── Geräte ───────────────────────────────

function geraeteGefiltert(z) {
  const t = norm(z.suche);
  return Z.daten.geraete.filter((g) => {
    if (!z.ausgemustert && g.status === 'ausgemustert' && z.status !== 'ausgemustert') return false;
    if (z.status && g.status !== z.status) return false;
    if (z.typ && g.geraetetyp_id !== z.typ) return false;
    if (z.ort && g.lagerplatz_id !== z.ort) return false;
    if (t && norm([g.bezeichnung, g.barcode, g.seriennummer, typName(g.geraetetyp_id), ortName(g.lagerplatz_id), g.bemerkung].join(' ')).indexOf(t) < 0) return false;
    return true;
  });
}

function seiteGeraete(param) {
  const z = ui('geraete', { suche: '', status: '', typ: '', ort: '', ausgemustert: false, gewaehlt: new Set(), sortiert: 'geraet' });
  if (!z.gewaehlt) z.gewaehlt = new Set();
  const technik = istTechnik();

  // Die Akte folgt der Adresse – öffnen, wenn sie darin steht; schließen, wenn nicht mehr.
  if (param && Z.idx.geraet.has(param)) {
    if (!offeneAkte || offeneAkte.zu || offeneAkte.geraetId !== param) {
      setTimeout(() => {
        const d = akteDialog(param, () => {
          if (Router.teile()[0] === 'geraete' && Router.teile()[1] === param) gehe('/geraete', true);
        });
        d.ausAdresse = true;
      }, 0);
    }
  } else if (offeneAkte && !offeneAkte.zu && offeneAkte.ausAdresse) {
    offeneAkte.schliessen();
  }

  const liste = geraeteGefiltert(z);
  // Gewählte, die nicht mehr zu sehen sind, bleiben gewählt – aber die Zahl nennt nur sichtbare.
  const gewaehlt = liste.filter((g) => z.gewaehlt.has(g.id)).map((g) => g.id);
  const filterAktiv = z.suche || z.status || z.typ || z.ort;

  const steuer = (k, text, optionen) => h('select', {
    id: 'gf-' + k,
    onchange: (e) => {
      z[k] = e.target.value;
      z.menge = 0;
      zeichnen();
    },
  }, [h('option', { value: '' }, text)].concat(optionen.map((o) => h('option', { value: o[0], selected: z[k] === o[0] }, o[1]))));

  return [
    werkzeugleiste('Geräte', plural(liste.length, 'Gerät', 'Geräte') + (filterAktiv ? ' gefiltert' : ''), [
      h('button.btn', { onclick: () => csvExport('geraete', liste) }, icon('download', 16), 'CSV'),
      technik ? knopf('Neues Gerät', 'plus', () => geraetFormular(null, { geraetetyp_id: z.typ, lagerplatz_id: z.ort }), 'btn-primary') : null,
    ]),
    h('div.karte',
      h('div.filterleiste',
        h('input.suche', {
          id: 'gf-suche',
          placeholder: 'Suchen: Bezeichnung, Barcode, Seriennummer, Typ …',
          value: z.suche,
          oninput: (e) => {
            z.suche = e.target.value;
            z.menge = 0;
            zeichnen();
          },
        }),
        steuer('status', 'Jeder Status', ALLE_STATUS.map((s) => [s, STATUS_TEXT[s]])),
        steuer('typ', 'Jeder Typ', sortiertNachName(Z.daten.typen).map((t) => [t.id, t.name])),
        steuer('ort', 'Jeder Lagerplatz', sortiertNachName(Z.daten.lagerplaetze).map((o) => [o.id, o.name])),
        h('label.haken', h('input', { type: 'checkbox', id: 'gf-aus', checked: z.ausgemustert, onchange: (e) => { z.ausgemustert = e.target.checked; zeichnen(); } }), h('span', 'Ausgemusterte zeigen')),
        filterAktiv ? h('button.btn.btn-klein.btn-text', { onclick: () => { Object.assign(z, { suche: '', status: '', typ: '', ort: '' }); zeichnen(); } }, 'Filter zurücksetzen') : null),
      gewaehlt.length ? h('div.filterleiste', { style: { background: 'var(--rot-50)' } },
        h('strong', gewaehlt.length + ' gewählt'),
        h('button.btn.btn-klein.btn-primary', { onclick: () => umlagernDialog(gewaehlt, () => { z.gewaehlt.clear(); zeichnen(); }) }, icon('umlagern', 14), 'Umlagern'),

function ortPfad(o) {
  const kette = [];
  let x = o;
  const gesehen = new Set();
  while (x && x.ober_id && !gesehen.has(x.id)) {
    gesehen.add(x.id);
    x = Z.idx.ort.get(x.ober_id);
    if (x) kette.unshift(x.name);
  }
  return kette.join(' › ');
}

// ─────────────────────────────── Etiketten ───────────────────────────────

function etikettQuellen(art) {
  if (art === 'lagerplaetze') {
    return sortiertNachName(Z.daten.lagerplaetze).map((o) => ({ id: o.id, titel: o.name, unter: ORT_TYP_TEXT[o.typ], code: o.code, suche: o.name + ' ' + o.code }));
  }
  if (art === 'saetze') {
    return sortiertNachName(Z.daten.saetze).map((s) => ({ id: s.id, titel: s.name, unter: 'Gerätesatz · ' + s.teile.length + ' Teile', code: s.barcode, suche: s.name + ' ' + s.barcode }));
  }
  return Z.daten.geraete.filter((g) => g.status !== 'ausgemustert')
    .sort((a, b) => vergleich(geraetTitel(a), geraetTitel(b)))
    .map((g) => ({ id: g.id, titel: geraetTitel(g), unter: typName(g.geraetetyp_id) + (g.seriennummer ? ' · SN ' + g.seriennummer : ''), code: g.barcode, suche: [g.bezeichnung, g.barcode, typName(g.geraetetyp_id), ortName(g.lagerplatz_id)].join(' ') }));
}

function seiteEtiketten() {
  const z = ui('etiketten', { art: 'geraete', gewaehlt: new Set(), groesse: 'mittel', suche: '' });
  const quellen = etikettQuellen(z.art);
  const sichtbar = quellen.filter((q) => !z.suche || norm(q.suche).indexOf(norm(z.suche)) >= 0);
  const gewaehlt = quellen.filter((q) => z.gewaehlt.has(q.id));
  const wehr = Z.daten.wehr.name;

  const bogen = h('div.etiketten-bogen.' + z.groesse, gewaehlt.map((q) => h('div.etikett',
    h('div.etikett-kopf', h('span', wehr), h('span', q.unter.split(' · ')[0])),
    h('div.etikett-titel', q.titel),

function protokollWert(feldName, wert) {
  if (wert === null || wert === undefined || wert === '') return '(leer)';
  if (typeof wert === 'boolean') return wert ? 'ja' : 'nein';
  if (feldName === 'status' || feldName === 'status_danach') return STATUS_TEXT[wert] || wert;
  if (/lagerplatz_id|von_id|nach_id|ober_id/.test(feldName)) return Z.idx.ort.has(wert) ? ortName(wert) : '(entfernt)';
  if (feldName === 'geraetetyp_id') return Z.idx.typ.has(wert) ? typName(wert) : '(entfernt)';
  if (feldName === 'geraet_id') return Z.idx.geraet.has(wert) ? geraetTitel(Z.idx.geraet.get(wert)) : '(entfernt)';
  if (feldName === 'mitglied_id') return Z.idx.mitglied.has(wert) ? Z.idx.mitglied.get(wert).name : '(entfernt)';
  if (feldName === 'art_id') return Z.idx.qualiart.has(wert) ? Z.idx.qualiart.get(wert).name : null;
  if (feldName === 'gueltig_einheit') return EINHEIT_TEXT[wert] || wert;
  if (feldName === 'beginn' || feldName === 'ende' || feldName === 'von' || feldName === 'bis') return datumZeit(wert);
  if (feldName === 'quelle_kennung') return null;
  if (feldName === 'quelle') return wert === 'einsatztagebuch' ? 'Einsatztagebuch' : wert;
  if (/_id$/.test(feldName) || feldName === 'stapel_id') return null;
  if (feldName === 'bedingungen' && typeof wert === 'object') return regelSatz({ ausloeser: wert.ergebnis ? 'pruefung' : 'umlagerung', bedingungen: wert, aktionen: [] }).map((x) => (typeof x === 'string' ? x : x.textContent)).join('').replace(/^Wenn |, dann \.$/g, '');
  if (feldName === 'aktionen' && Array.isArray(wert)) return regelSatz({ bedingungen: {}, aktionen: wert }).slice(-1)[0].replace(/\.$/, '');
  if (feldName === 'ergebnis') return wert === 'nicht_bestanden' ? 'nicht bestanden' : wert;
  if (feldName === 'ausloeser') return wert === 'pruefung' ? 'Prüfung' : 'Umlagerung';
  if (typeof wert === 'object') return JSON.stringify(wert);
  const t = String(wert);
  return t.length > 80 ? t.slice(0, 80) + '…' : t;
}

function protokollEinzelheiten(e) {
  const d = e.details || {};
  const teile = [];
  if (d.aenderungen) {
    Object.keys(d.aenderungen).forEach((k) => {
      const paar = d.aenderungen[k];
      const alt = protokollWert(k, paar[0]);
      const neu = protokollWert(k, paar[1]);
      if (alt === null && neu === null) return;
      teile.push((FELD_TEXT[k] || k) + ': ' + alt + ' → ' + neu);
    });
  } else {
    const quelle = d.angelegt || d.geloescht || d;
    Object.keys(quelle).forEach((k) => {
      const w = protokollWert(k, quelle[k]);
      if (w !== null && w !== '(leer)' && k !== 'schritte' && k !== 'position') teile.push((FELD_TEXT[k] || k) + ': ' + w);
    });
  }
  return teile.join(' · ');
}

/**
 * Excel und LibreOffice führen „=…“, „+…“, „-…“ und „@…“ auch aus einer CSV-Datei als
 * Formel aus – ein Gerät mit der Bemerkung „=HYPERLINK(…)“ würde beim Öffnen zum Verweis.
 * Ein vorangestelltes Hochkomma macht daraus Text; der Import nimmt es wieder weg.
 */
function csvZelle(w) {
  let t = w === null || w === undefined ? '' : String(w);
  if (/^[=+@\t\r]/.test(t) || /^-(?![\d.,]+$)/.test(t)) t = "'" + t;
  return /[";\n\r]/.test(t) ? '"' + t.replace(/"/g, '""') + '"' : t;
}

/** Semikolon als Trenner: Das öffnet ein deutsches Excel ohne Nachfrage richtig. */
function csvExport(art, zeilen) {
  let kopf;
  let daten;
  if (art === 'geraete') {
    kopf = ['typ', 'bezeichnung', 'seriennummer', 'barcode', 'lagerplatz', 'status', 'naechste_pruefung', 'satz', 'bemerkung'];
    daten = (zeilen || Z.daten.geraete).map((g) => {
      const s = naechsteFaelligkeit(g.id);
      return [typName(g.geraetetyp_id), g.bezeichnung, g.seriennummer, g.barcode, (Z.idx.ort.get(g.lagerplatz_id) || {}).code || '', g.status,
        s ? s.naechste_faellig : '', g.satz_id ? Z.idx.satz.get(g.satz_id).name : '', g.bemerkung];
    });
  } else if (art === 'lagerplaetze') {
    kopf = ['name', 'code', 'typ', 'gehoert_zu', 'geraete', 'zuletzt_gezaehlt'];
    daten = Z.daten.lagerplaetze.map((o) => [o.name, o.code, o.typ, o.ober_id ? ortName(o.ober_id) : '', o.bestand, o.zuletzt_gezaehlt || '']);
  } else if (art === 'faelligkeiten') {
    kopf = ['geraet', 'barcode', 'typ', 'pruefplan', 'intervall', 'naechste_faelligkeit', 'zuletzt_geprueft', 'standort'];
    daten = Z.daten.arbeitsliste.filter((a) => a.art === 'pruefung').sort((a, b) => a.tage - b.tage).map((a) => {
      const g = Z.idx.geraet.get(a.geraet_id);
      return [geraetTitel(g), g.barcode, typName(g.geraetetyp_id), (Z.idx.plan.get(a.plan_id) || {}).name, intervallText(a.intervall_wert, a.intervall_einheit), a.faellig, a.zuletzt || '', ortName(g.lagerplatz_id)];
    });
  } else {
    kopf = ['typ', 'hersteller', 'modell', 'pruefplan', 'intervall_wert', 'intervall_einheit', 'schritte'];
    daten = [];
    Z.daten.typen.forEach((t) => {
      const plaene = Z.daten.plaene.filter((p) => p.geraetetyp_id === t.id && !p.geraet_id);
      if (!plaene.length) daten.push([t.name, t.hersteller, t.modell, '', '', '', '']);
      plaene.forEach((p) => daten.push([t.name, t.hersteller, t.modell, p.name, p.intervall_wert, p.intervall_einheit,
        Z.daten.schritte.filter((s) => s.pruefplan_id === p.id).sort((a, b) => a.position - b.position).map((s) => s.titel).join(' | ')]));
    });
  }
  const text = [kopf].concat(daten).map((z) => z.map(csvZelle).join(';')).join('\r\n');
  herunterladen(art + '_' + heute() + '.csv', 'text/csv', text);
}

/** CSV oder aus Excel kopierte Zellen (Tabulator) – der Trenner wird erraten. */
function csvLesen(text) {
  const erste = text.split(/\r?\n/)[0] || '';
  const trenner = erste.indexOf('\t') >= 0 ? '\t' : (erste.split(';').length >= erste.split(',').length ? ';' : ',');
  const zeilen = [];
  let zeile = [];
  let zelle = '';
  let inAnf = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (inAnf) {
      if (c === '"' && text[i + 1] === '"') {
        zelle += '"';
        i++;
      } else if (c === '"') inAnf = false;
      else zelle += c;
    } else if (c === '"') inAnf = true;
    else if (c === trenner) {
      zeile.push(zelle);
      zelle = '';
    } else if (c === '\n' || c === '\r') {
      if (c === '\r' && text[i + 1] === '\n') i++;
      zeile.push(zelle);
      zeilen.push(zeile);
      zeile = [];
      zelle = '';
    } else zelle += c;
  }
  if (zelle || zeile.length) {
    zeile.push(zelle);
    zeilen.push(zeile);
  }
  return zeilen.filter((z) => z.some((x) => String(x).trim()));
}

function seiteImport() {
  const z = ui('import', { text: '', typenAnlegen: false, ergebnis: null });
  const zeilen = z.text.trim() ? csvLesen(z.text.replace(/^﻿/, '')) : [];
  const kopf = zeilen.length ? zeilen[0].map((k) => norm(k).replace(/\s+/g, '_')) : [];
  const spalte = (namen) => kopf.findIndex((k) => namen.indexOf(k) >= 0);
  const pos = {
    typ: spalte(['typ', 'geraetetyp', 'gerätetyp', 'art']),
    bezeichnung: spalte(['bezeichnung', 'name', 'kennung']),
    seriennummer: spalte(['seriennummer', 'sn', 'serien-nr', 'seriennr']),
    barcode: spalte(['barcode', 'code']),
    lagerplatz: spalte(['lagerplatz', 'standort', 'ort']),
    status: spalte(['status', 'zustand']),
    bemerkung: spalte(['bemerkung', 'notiz', 'hinweis']),
  };
  const daten = zeilen.slice(1).map((r) => {
    const o = {};
    Object.keys(pos).forEach((k) => {
      o[k] = pos[k] >= 0 ? String(r[pos[k]] || '').trim().replace(/^'(?=[=+\-@])/, '') : '';
    });
    const typ = Z.daten.typen.find((t) => norm(t.name) === norm(o.typ));

/** Ein Logo auf Briefkopfgröße bringen – eine Zelle fasst 50 000 Zeichen. */
function logoVerkleinern(datei) {
  return new Promise((erfuellt, abgelehnt) => {
    const bild = new Image();
    bild.onload = () => {
      const faktor = Math.min(1, 320 / bild.width, 160 / bild.height);
      const c = document.createElement('canvas');
      c.width = Math.round(bild.width * faktor);
      c.height = Math.round(bild.height * faktor);
      c.getContext('2d').drawImage(bild, 0, 0, c.width, c.height);
      let url = c.toDataURL('image/png');
      [0.9, 0.8, 0.65, 0.5].forEach((q) => {
        if (url.length > 45000) {
          const k = document.createElement('canvas');
          k.width = c.width;
          k.height = c.height;
          const ctx = k.getContext('2d');
          ctx.fillStyle = '#fff';
          ctx.fillRect(0, 0, k.width, k.height);
          ctx.drawImage(c, 0, 0);
          url = k.toDataURL('image/jpeg', q);
        }
      });
      if (url.length > 45000) abgelehnt(new Error('Das Bild bleibt auch verkleinert zu groß.'));
      else erfuellt(url);
    };
    bild.onerror = () => abgelehnt(new Error('Das Bild ließ sich nicht lesen.'));
    bild.src = URL.createObjectURL(datei);
  });
}
