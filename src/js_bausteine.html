function svgAus(innen, groesse, strich) {
  const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('width', groesse);
  s.setAttribute('height', groesse);
  s.setAttribute('fill', 'none');
  s.setAttribute('stroke', 'currentColor');
  s.setAttribute('stroke-width', strich || '1.75');
  s.setAttribute('stroke-linecap', 'round');
  s.setAttribute('stroke-linejoin', 'round');
  s.setAttribute('aria-hidden', 'true');
  s.setAttribute('class', 'icon');
  s.innerHTML = innen; // nur die festen Pfade oben, nie Eingaben
  return s;
}

function icon(name, groesse) {
  return svgAus(ICONS[name] || ICONS.geraet, groesse || 18);
}

function ortIcon(typ, groesse) {
  return icon({ lager: 'lager', fahrzeug: 'fahrzeug', werkstatt: 'werkstatt' }[typ] || 'ort', groesse || 16);
}

/** Das Wehrlogo, wenn eines hinterlegt ist – sonst die Flamme. */
function wehrLogo(klasse, groesse) {
  const logo = Z.start.logo;
  if (logo) return h('span.' + klasse + '.bild', h('img', { src: logo, alt: '' }));
  return h('span.' + klasse, svgAus(FLAMME, groesse || 22, '1.9'));
}

function faelligBadge(tage) {
  if (tage === null || tage === undefined) return h('span.badge.badge-grau', 'kein Termin');
  if (tage < 0) return h('span.badge.badge-rot', faelligText(tage));
  if (tage <= ((Z.daten && Z.daten.kennzahlen.vorwarnung) || 30)) return h('span.badge.badge-gelb', faelligText(tage));
  return h('span.badge.badge-gruen', faelligText(tage));
}

const VOLLST_TEXT = { vollstaendig: 'Vollständig', unvollstaendig: 'Unvollständig', abweichend: 'Abweichend' };
const VOLLST_FARBE = { vollstaendig: 'badge-gruen', unvollstaendig: 'badge-rot', abweichend: 'badge-gelb' };

function ortZeile(id) {
  const o = Z.idx.ort.get(id);
  if (!o) return h('span.gedimmt', '–');
  return h('span', { style: { display: 'inline-flex', gap: '6px', alignItems: 'center' } }, ortIcon(o.typ), o.name);
}

/** Die nächste Fälligkeit eines Geräts – über alle aktiven Pläne. */
function naechsteFaelligkeit(geraetId) {
  const stand = (Z.idx.standVon.get(geraetId) || []).filter((s) => s.aktiv);
  if (!stand.length) return null;
  return stand.reduce((a, b) => (a.naechste_faellig <= b.naechste_faellig ? a : b));
}

// ─────────────────────────────── Tabelle ───────────────────────────────

/**
 * Eine Tabelle, die am Telefon zu Karten wird.
 *
 *   spalten   – [{ id, titel, wert(z) (zum Sortieren), zelle(z), klasse }]
 *   zeilen    – die Daten
 *   zustand   – ui()-Objekt der Seite; dort liegen Sortierung und angezeigte Menge
 *   aktion    – (z) => Knöpfe für die letzte Spalte
 *   klick     – (z) => beim Anklicken der Zeile
 *   auswahl   – { set: Set, neu() } – Ankreuzfelder für Mehrfachauswahl
 *
 * Die Beschriftung für den Kartenmodus (`data-label`) setzt sie selbst. Sie den
 * aufrufenden Seiten zu überlassen hieße, dass die nächste Tabelle sie vergisst.
 */
function tabelle(opt) {
  const z = opt.zustand || {};
  const spalten = opt.spalten;
  let zeilen = opt.zeilen.slice();
  const sortSpalte = spalten.find((s) => s.id === z.sortiert) || (opt.sortVorgabe ? spalten.find((s) => s.id === opt.sortVorgabe) : null);
  if (sortSpalte && sortSpalte.wert) {
    const richtung = z.absteigend ? -1 : 1;
    zeilen.sort((a, b) => richtung * vergleich(sortSpalte.wert(a), sortSpalte.wert(b)));
  }
  if (!zeilen.length) return h('div.leer', opt.leer || 'Keine Einträge.');
  const menge = z.menge || opt.seite || 100;
  const sichtbar = zeilen.slice(0, menge);
  const neu = opt.neu || (() => zeichnen());

  const auswahl = opt.auswahl;
  const alleGewaehlt = auswahl && sichtbar.length && sichtbar.every((r) => auswahl.set.has(opt.schluessel(r)));

  const kopf = h('thead', h('tr',
    auswahl ? h('th.spalte-wahl', h('input', {
      type: 'checkbox',
      checked: !!alleGewaehlt,
      'aria-label': 'Alle wählen',
      onchange: (e) => {
        sichtbar.forEach((r) => (e.target.checked ? auswahl.set.add(opt.schluessel(r)) : auswahl.set.delete(opt.schluessel(r))));
        auswahl.neu();
      },
    })) : null,
    spalten.map((s) => h('th' + (s.wert ? '.sortierbar' : '') + (s.klasse ? '.' + s.klasse : ''), {
      onclick: s.wert ? () => {
        if (z.sortiert === s.id) z.absteigend = !z.absteigend;
        else {
          z.sortiert = s.id;
          z.absteigend = false;
        }
        neu();
      } : null,
    }, s.titel, (sortSpalte === s && z.sortiert) ? h('span.pfeil', z.absteigend ? '↓' : '↑') : null)),
    opt.aktion ? h('th.aktion', '') : null));

  const rumpf = h('tbody', sichtbar.map((r) => {
    const schluessel = opt.schluessel(r);
    const tr = h('tr' + (opt.klick ? '.klickbar' : '') + (auswahl && auswahl.set.has(schluessel) ? '.gewaehlt' : ''), {
      onclick: opt.klick ? (e) => {
        if (e.target.closest('button, input, a, select, label')) return;
        opt.klick(r);
      } : null,
    },
    auswahl ? h('td.spalte-wahl', h('input', {
      type: 'checkbox',
      checked: auswahl.set.has(schluessel),
      'aria-label': 'Wählen',
      onchange: (e) => {
        if (e.target.checked) auswahl.set.add(schluessel);
        else auswahl.set.delete(schluessel);
        auswahl.neu();
      },
    })) : null,
    // Der Inhalt jeder Zelle steckt in einem eigenen Element: Als Karte steht er dann
    // als EIN Block neben seiner Beschriftung, statt sich über die Breite zu verteilen.
    spalten.map((s, i) => h('td' + (s.klasse ? '.' + s.klasse : '') + (i === 0 ? '.kopfzelle' : ''), { 'data-label': s.titel },
      h('div.zelle', s.zelle ? s.zelle(r) : String(s.wert(r) == null ? '' : s.wert(r))))),
    opt.aktion ? h('td.aktion', opt.aktion(r)) : null);
    return tr;
  }));

  return h('div',
    h('div.tabelle-wrap', h('table.tabelle-karten', kopf, rumpf)),
    zeilen.length > menge
      ? h('div.mehr-zeilen', h('button.btn.btn-klein', {
        onclick: () => {
          z.menge = menge + 200;
          neu();
        },
      }, 'Weitere ' + Math.min(200, zeilen.length - menge) + ' von ' + (zeilen.length - menge) + ' anzeigen'))
      : null);
}

// ─────────────────────────────── Code 128 ───────────────────────────────

/**
 * Die 107 Muster des Standards. Je sechs Breiten, abwechselnd Balken und Lücke,
 * beginnend mit einem Balken – Muster 106 (Stopp) hat sieben.
 */
const C128 = [
  '212222', '222122', '222221', '121223', '121322', '131222', '122213', '122312', '132212', '221213',
  '221312', '231212', '112232', '122132', '122231', '113222', '123122', '123221', '223211', '221132',
  '221231', '213212', '223112', '312131', '311222', '321122', '321221', '312212', '322112', '322211',
  '212123', '212321', '232121', '111323', '131123', '131321', '112313', '132113', '132311', '211313',
  '231113', '231311', '112133', '112331', '132131', '113123', '113321', '133121', '313121', '211331',
  '231131', '213113', '213311', '213131', '311123', '311321', '331121', '312113', '312311', '332111',
  '314111', '221411', '431111', '111224', '111422', '121124', '121421', '141122', '141221', '112214',
  '112412', '122114', '122411', '142112', '142211', '241211', '221114', '413111', '241112', '134111',
  '111242', '121142', '121241', '114212', '124112', '124211', '411212', '421112', '421211', '212141',
  '214121', '412121', '111143', '111341', '131141', '114113', '114311', '411113', '411311', '113141',
  '114131', '311141', '411131', '211412', '211214', '211232', '2331112',
];

/** Nur Zeichensatz B: Die Codes hier sind Großbuchstaben, Ziffern und Bindestriche. */
function code128(text) {
  const werte = [];
  for (const zeichen of String(text)) {
    const c = zeichen.charCodeAt(0);
    if (c < 32 || c > 126) return null;
    werte.push(c - 32);
  }
  if (!werte.length) return null;
  let summe = 104;
  werte.forEach((w, i) => {
    summe += w * (i + 1);
  });
  const folge = [104].concat(werte, [summe % 103, 106]);
  const breiten = [];
  folge.forEach((v) => C128[v].split('').forEach((b) => breiten.push(Number(b))));
  return breiten;
}

/** Als SVG – gestochen scharf auf dem Bildschirm wie auf dem Papier. */
function code128Svg(text) {
  const breiten = code128(text);
  const ns = 'http://www.w3.org/2000/svg';
  const s = document.createElementNS(ns, 'svg');
  if (!breiten) return s;
  const ruhe = 10;
  const gesamt = breiten.reduce((a, b) => a + b, 0) + ruhe * 2;
  s.setAttribute('viewBox', '0 0 ' + gesamt + ' 40');
  s.setAttribute('preserveAspectRatio', 'none');
  s.setAttribute('shape-rendering', 'crispEdges');
  let x = ruhe;
  let d = '';
  breiten.forEach((b, i) => {
    if (i % 2 === 0) d += 'M' + x + ' 0h' + b + 'v40h-' + b + 'z';
    x += b;
  });
  const p = document.createElementNS(ns, 'path');
  p.setAttribute('d', d);
  p.setAttribute('fill', '#000');
  s.append(p);
  return s;
}

// ─────────────────────────────── QR-Code ───────────────────────────────
// Byte-Modus, Fehlerkorrektur M, Versionen 1 bis 12. Für Ausweise (34 Zeichen) reicht
// Version 3. Portiert aus `web/src/qr.ts` des SaaS-Produkts, dort von zbar und am
// Aufbau geprüft.

const QR = (() => {
  const DATENBYTES_M = [0, 16, 28, 44, 64, 86, 108, 124, 154, 182, 216, 254, 290];
  const BLOECKE_M = [[], [10, 1, 16, 0, 0], [16, 1, 28, 0, 0], [26, 1, 44, 0, 0], [18, 2, 32, 0, 0], [24, 2, 43, 0, 0],
    [16, 4, 27, 0, 0], [18, 4, 31, 0, 0], [22, 2, 38, 2, 39], [22, 3, 36, 2, 37], [26, 4, 43, 1, 44], [30, 1, 50, 4, 51],
    [22, 6, 36, 2, 37]];
  const AUSRICHTUNG = [[], [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34], [6, 22, 38], [6, 24, 42], [6, 26, 46],
    [6, 28, 50], [6, 30, 54], [6, 32, 58]];
  const EXP = new Uint8Array(512);
  const LOG = new Uint8Array(256);
  let x = 1;
  for (let i = 0; i < 255; i++) {
    EXP[i] = x;
    LOG[x] = i;
    x <<= 1;
    if (x & 0x100) x ^= 0x11d;
  }
  for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
  const mul = (a, b) => (a === 0 || b === 0 ? 0 : EXP[LOG[a] + LOG[b]]);

  function generator(n) {
    let g = [1];
    for (let i = 0; i < n; i++) {
      const naechst = new Array(g.length + 1).fill(0);
      for (let j = 0; j < g.length; j++) {
        naechst[j] ^= mul(g[j], 1);
        naechst[j + 1] ^= mul(g[j], EXP[i]);
      }
      g = naechst;
    }
    return g;
  }
  function ecBytes(daten, anzahl) {
    const g = generator(anzahl);
    const rest = daten.concat(new Array(anzahl).fill(0));
    for (let i = 0; i < daten.length; i++) {
      const f = rest[i];
      if (f === 0) continue;
      for (let j = 0; j < g.length; j++) rest[i + j] ^= mul(g[j], f);
    }
    return rest.slice(daten.length);
  }
  function formatBits(maske) {
    const wert = (0 << 3) | maske; // Stufe M ist 00
    let rest = wert << 10;
    for (let i = 4; i >= 0; i--) if (rest & (1 << (i + 10))) rest ^= 0b10100110111 << i;
    return ((wert << 10) | rest) ^ 0b101010000010010;
  }
  function versionBits(version) {
    let rest = version << 12;
    for (let i = 5; i >= 0; i--) if (rest & (1 << (i + 12))) rest ^= 0b1111100100101 << i;
    return (version << 12) | rest;
  }

  function setze(m, x, y, an, fest) {
    m.modul[idx(m, x, y)] = an ? 1 : 0;

  }
  function festeMuster(m, version) {
    const g = m.groesse;
    [[0, 0], [g - 7, 0], [0, g - 7]].forEach(([sx, sy]) => {
      for (let dy = -1; dy <= 7; dy++) {
        for (let dx = -1; dx <= 7; dx++) {
          const px = sx + dx;
          const py = sy + dy;
          if (px < 0 || py < 0 || px >= g || py >= g) continue;
          const rand = dx === -1 || dy === -1 || dx === 7 || dy === 7;

        }
      }
    });
    for (let i = 8; i < g - 8; i++) {
      setze(m, i, 6, i % 2 === 0);
      setze(m, 6, i, i % 2 === 0);
    }
    const mitten = AUSRICHTUNG[version];
    mitten.forEach((cy) => mitten.forEach((cx) => {
      const beiSucher = (cx <= 8 && cy <= 8) || (cx >= g - 9 && cy <= 8) || (cx <= 8 && cy >= g - 9);
      if (beiSucher) return;
      for (let dy = -2; dy <= 2; dy++) {
        for (let dx = -2; dx <= 2; dx++) {

    for (let i = 0; i < 9; i++) {
      if (i !== 6) setze(m, i, 8, false);

    }

    for (let i = 0; i < 7; i++) setze(m, 8, g - 1 - i, false);
    setze(m, 8, g - 8, true);
    if (version >= 7) {
      const bits = versionBits(version);
      for (let i = 0; i < 18; i++) {
        const an = ((bits >> i) & 1) === 1;

    }
  }
  const MASKEN = [
    (x, y) => (x + y) % 2 === 0,
    (x, y) => y % 2 === 0,
    (x) => x % 3 === 0,
    (x, y) => (x + y) % 3 === 0,
    (x, y) => (Math.floor(y / 2) + Math.floor(x / 3)) % 2 === 0,
    (x, y) => ((x * y) % 2) + ((x * y) % 3) === 0,
    (x, y) => (((x * y) % 2) + ((x * y) % 3)) % 2 === 0,

    const g = m.groesse;

    let punkte = 0;
    for (let i = 0; i < g; i++) {
      [true, false].forEach((waagerecht) => {

        for (let j = 1; j < g; j++) {

          const b = waagerecht ? an(j - 1, i) : an(i, j - 1);
          if (a === b) lauf++;
          else {
            if (lauf >= 5) punkte += 3 + (lauf - 5);
            lauf = 1;
          }
        }
        if (lauf >= 5) punkte += 3 + (lauf - 5);
      });
    }
    for (let y = 0; y < g - 1; y++) {
      for (let x = 0; x < g - 1; x++) {
        const a = an(x, y);
        if (a === an(x + 1, y) && a === an(x, y + 1) && a === an(x + 1, y + 1)) punkte += 3;
      }
    }
    const MUSTER = [true, false, true, true, true, false, true, false, false, false, false];
    const UMGEKEHRT = MUSTER.slice().reverse();
    for (let y = 0; y < g; y++) {
      for (let x = 0; x <= g - 11; x++) {
        if (MUSTER.every((v, i) => an(x + i, y) === v) || UMGEKEHRT.every((v, i) => an(x + i, y) === v)) punkte += 40;
        if (MUSTER.every((v, i) => an(y, x + i) === v) || UMGEKEHRT.every((v, i) => an(y, x + i) === v)) punkte += 40;
      }
    }
    let dunkel = 0;
    for (let i = 0; i < m.modul.length; i++) if (m.modul[i]) dunkel++;
    punkte += Math.floor(Math.abs((dunkel * 100) / (g * g) - 50) / 5) * 10;
    return punkte;
  }
  function matrix(text) {
    const roh = Array.from(new TextEncoder().encode(text));
    let version = 0;
    for (let v = 1; v <= 12; v++) {
      if (DATENBYTES_M[v] * 8 >= 4 + (v <= 9 ? 8 : 16) + roh.length * 8) {
        version = v;
        break;
      }
    }
    if (!version) throw new Error('Text zu lang für einen QR-Code.');
    const [ecJeBlock, g1, d1, g2, d2] = BLOECKE_M[version];
    const bits = [];
    const schreibe = (wert, anzahl) => {
      for (let i = anzahl - 1; i >= 0; i--) bits.push((wert >> i) & 1);
    };
    schreibe(0b0100, 4);
    schreibe(roh.length, version <= 9 ? 8 : 16);
    roh.forEach((b) => schreibe(b, 8));
    const kapazitaet = DATENBYTES_M[version] * 8;
    schreibe(0, Math.min(4, kapazitaet - bits.length));
    while (bits.length % 8 !== 0) bits.push(0);
    const fueller = [0xec, 0x11];
    for (let i = 0; bits.length < kapazitaet; i++) schreibe(fueller[i % 2], 8);
    const datenBytes = [];
    for (let i = 0; i < bits.length; i += 8) datenBytes.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));
    const bloecke = [];
    let zeiger = 0;
    [[g1, d1], [g2, d2]].forEach(([anzahl, groesse]) => {
      for (let i = 0; i < anzahl; i++) {
        const daten = datenBytes.slice(zeiger, zeiger + groesse);
        zeiger += groesse;
        bloecke.push({ daten: daten, ec: ecBytes(daten, ecJeBlock) });
      }
    });
    const strom = [];
    const maxDaten = Math.max.apply(null, bloecke.map((b) => b.daten.length));
    for (let i = 0; i < maxDaten; i++) bloecke.forEach((b) => i < b.daten.length && strom.push(b.daten[i]));
    for (let i = 0; i < ecJeBlock; i++) bloecke.forEach((b) => strom.push(b.ec[i]));
    const groesse = version * 4 + 17;
    const bauen = (maske) => {
      const m = { groesse: groesse, modul: new Uint8Array(groesse * groesse), belegt: new Uint8Array(groesse * groesse) };
      festeMuster(m, version);
      let bit = 0;
      let aufwaerts = true;
      for (let rechts = groesse - 1; rechts >= 1; rechts -= 2) {
        if (rechts === 6) rechts = 5;
        for (let i = 0; i < groesse; i++) {
          const y = aufwaerts ? groesse - 1 - i : i;
          [rechts, rechts - 1].forEach((px) => {
            if (m.belegt[idx(m, px, y)]) return;
            const wert = bit < strom.length * 8 ? (strom[bit >> 3] >> (7 - (bit % 8))) & 1 : 0;
            bit++;
            setze(m, px, y, (wert === 1) !== MASKEN[maske](px, y), false);
          });
        }
        aufwaerts = !aufwaerts;
      }
      const f = formatBits(maske);
      for (let i = 0; i < 15; i++) {
        const an = ((f >> i) & 1) === 1;
        if (i < 6) setze(m, 8, i, an);
        else if (i < 8) setze(m, 8, i + 1, an);
        else if (i === 8) setze(m, 7, 8, an);
        else setze(m, 14 - i, 8, an);
        if (i < 8) setze(m, groesse - 1 - i, 8, an);
        else setze(m, 8, groesse - 15 + i, an);
      }
      return m;
    };
    let beste = null;
    let bestePunkte = Infinity;
    for (let maske = 0; maske < 8; maske++) {
      const k = bauen(maske);
      const p = strafe(k);

    hg.setAttribute('height', gesamt);

})();

// ─────────────────────────────── Töne ───────────────────────────────

let tonKontext = null;
function ton(frequenz, dauer) {
  try {
    tonKontext = tonKontext || new (window.AudioContext || window.webkitAudioContext)();
    const o = tonKontext.createOscillator();
    const g = tonKontext.createGain();
    o.frequency.value = frequenz;
    o.type = 'sine';
    g.gain.value = 0.12;
    o.connect(g);
    g.connect(tonKontext.destination);
    o.start();
    o.stop(tonKontext.currentTime + dauer / 1000);
  } catch (e) {
    // Kein Ton ist kein Fehler.
  }
}
const piepOk = () => ton(1320, 90);
const piepFehler = () => {
  ton(220, 160);
  setTimeout(() => ton(180, 200), 180);
};

// ─────────────────────────────── Scanner ───────────────────────────────

/**
 * Scannen: drei Wege, keine Bibliothek.
 *
 *   1. Handscanner – tippt wie eine Tastatur ins Feld, Enter schickt ab.
 *   2. Kamera live – `BarcodeDetector`, den Chrome auf Android mitbringt.
 *   3. Foto – wenn der eingebettete Rahmen von Apps Script die Kamera nicht freigibt,
 *      öffnet `capture` die Kamera-App des Telefons; erkannt wird auf dem Foto.
 *
 * Safari kann `BarcodeDetector` nicht. Dort bleibt das Feld (und der Handscanner),
 * und die Oberfläche sagt warum, statt einen Knopf anzubieten, der nichts tut.
 */
const FORMATE = ['code_128', 'qr_code', 'code_39', 'ean_13', 'data_matrix'];
let formatePruefung = null;
function scanFormate() {
  if (!formatePruefung) {
    formatePruefung = (async () => {
      if (!window.BarcodeDetector) return null;
      try {
        const koennen = await window.BarcodeDetector.getSupportedFormats();
        const treffer = FORMATE.filter((f) => koennen.indexOf(f) >= 0);
        return treffer.length ? treffer : null;
      } catch (e) {
        return null;
      }
    })();
  }
  return formatePruefung;
}

let aktiveKamera = null;
function kameraStoppen() {
  if (aktiveKamera) aktiveKamera();
  aktiveKamera = null;
}

function scanner(opt) {
  const wurzel = h('div.scanner');
  let zuletzt = { code: '', zeit: 0 };
  const melden = (code) => {
    code = String(code || '').trim();
    if (!code) return;
    const jetzt = Date.now();
    if (zuletzt.code === code && jetzt - zuletzt.zeit < 2500) return;
    zuletzt = { code: code, zeit: jetzt };
    if (navigator.vibrate) navigator.vibrate(40);
    opt.beiCode(code);
  };
  const feld = h('input', {
    id: opt.id || 'scan-feld',
    placeholder: opt.platzhalter || 'Code scannen oder eintippen',
    autocomplete: 'off',
    autocapitalize: 'characters',
    spellcheck: 'false',
    enterkeyhint: 'go',
    onkeydown: (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        const wert = feld.value;
        feld.value = '';
        melden(wert);
      }
    },
  });
  const kameraKnopf = h('button.btn', { type: 'button', title: 'Kamera', 'aria-label': 'Mit der Kamera scannen' }, icon('kamera', 22));
  const fotoEingabe = h('input', { type: 'file', accept: 'image/*', capture: 'environment', style: { display: 'none' } });
  const bereich = h('div');
  const hinweis = h('div.scanner-hinweis');
  wurzel.append(h('div.scanner-zeile', feld, kameraKnopf), fotoEingabe, bereich, hinweis);

  scanFormate().then((formate) => {
    if (!formate) {
      kameraKnopf.classList.add('versteckt');
      if (opt.hinweisOhneKamera !== false) {
        hinweis.textContent = 'Dieser Browser kann keine Codes aus der Kamera lesen (z. B. Safari). Handscanner oder Eintippen funktioniert.';
      }
    }
  });

  const ausFoto = async (datei) => {
    try {
      const formate = await scanFormate();
      const bild = await createImageBitmap(datei);
      const treffer = await new window.BarcodeDetector({ formats: formate }).detect(bild);
      if (treffer.length) {
        piepOk();
        melden(treffer[0].rawValue);
      } else {
        piepFehler();
        meldung.fehler(new Error('Auf dem Foto war kein Code zu erkennen. Näher heran, gerade halten.'));
      }
    } catch (e) {
      meldung.fehler(e);
    }
  };
  fotoEingabe.addEventListener('change', () => {
    if (fotoEingabe.files && fotoEingabe.files[0]) ausFoto(fotoEingabe.files[0]);
    fotoEingabe.value = '';
  });

  kameraKnopf.addEventListener('click', async () => {
    if (aktiveKamera) {
      kameraStoppen();
      return;
    }
    const formate = await scanFormate();
    if (!formate) return;
    let strom;
    try {
      strom = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 } } });
    } catch (e) {
      // Der Rahmen von Apps Script gibt die Kamera nicht immer frei. Dann das Foto.
      hinweis.textContent = 'Live-Kamera nicht verfügbar – es öffnet sich die Kamera-App. Foto vom Code machen.';
      fotoEingabe.click();
      return;
    }
    const video = h('video', { playsinline: true, muted: true, autoplay: true });
    video.srcObject = strom;
    bereich.replaceChildren(h('div.scanner-video', video));
    kameraKnopf.classList.add('btn-primary');
    let laeuft = true;
    const detektor = new window.BarcodeDetector({ formats: formate });
    aktiveKamera = () => {
      laeuft = false;
      strom.getTracks().forEach((t) => t.stop());
      bereich.replaceChildren();
      kameraKnopf.classList.remove('btn-primary');
    };
    try {
      await video.play();
    } catch (e) {
      // autoplay
    }
    const schauen = async () => {
      if (!laeuft || !video.isConnected) {
        if (laeuft) kameraStoppen();
        return;
      }
      try {
        const treffer = await detektor.detect(video);
        if (treffer.length) {
          piepOk();
          melden(treffer[0].rawValue);
        }
      } catch (e) {
        // ein einzelnes Bild ohne Erfolg
      }
      setTimeout(schauen, 220);
    };
    schauen();
  });

  if (opt.fokus && window.matchMedia('(pointer: fine)').matches) setTimeout(() => feld.focus(), 50);
  return wurzel;
}

// ─────────────────────────────── Auswahl von Geräten ───────────────────────────────

/** Ein Suchfeld, das Geräte vorschlägt – für Sätze und die Arbeitsliste. */
function geraeteSuche(opt) {
  const z = { text: '' };
  const liste = h('div');
  const zeigen = () => {
    const t = norm(z.text);
    if (!t) {
      liste.replaceChildren();
      return;
    }
    const treffer = Z.daten.geraete
      .filter((g) => (!opt.filter || opt.filter(g)) &&
        norm([g.bezeichnung, g.barcode, g.seriennummer, typName(g.geraetetyp_id)].join(' ')).indexOf(t) >= 0)
      .slice(0, 8);
    liste.replaceChildren(treffer.length
      ? h('div.karte', { style: { marginTop: '6px' } }, treffer.map((g) => h('button.stamm-eintrag', {
        type: 'button',
        onclick: () => {
          z.text = '';
          eingabeFeld.value = '';
          liste.replaceChildren();
          opt.gewaehlt(g);
        },
      }, h('strong', geraetTitel(g)), h('span.klein.gedimmt', typName(g.geraetetyp_id) + ' · ' + g.barcode + ' · ' + ortName(g.lagerplatz_id)))))
      : h('div.klein.gedimmt', { style: { padding: '6px 2px' } }, 'Kein passendes Gerät.'));
  };
  const eingabeFeld = h('input', {
    id: opt.id || 'geraete-suche',
    placeholder: opt.platzhalter || 'Gerät suchen: Bezeichnung, Barcode, Typ …',
    oninput: (e) => {
      z.text = e.target.value;
      zeigen();
    },
    onkeydown: (e) => {
      if (e.key === 'Enter') {
        const t = aufloesen(e.target.value);
        if (t && t.art === 'geraet') {
          e.preventDefault();
          e.target.value = '';
          z.text = '';
          liste.replaceChildren();
          opt.gewaehlt(t.obj);
        }
      }
    },
  });
  return h('div', eingabeFeld, liste);
}
